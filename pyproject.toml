[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ips-mcp"
version = "0.1.0"
description = "Read-only MCP bridge to IPS Web API"
requires-python = ">=3.10"
dependencies = ["httpx"]

[project.scripts]
ips-mcp = "ips_mcp.server:run"

[tool.setuptools]
package-dir = {"" = "src"}.